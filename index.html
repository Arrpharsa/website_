<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Kamu yang Tersayang ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="hero">
        <div class="hero-content">
            <h1>Untuk fani orang yang paling asa sayang</h1>
            <p class="subtitle">Fani adalah alasan mengapa asa tersenyum sampai sekarang</p>
            <button class="quote-button" onclick="showQuestion()">"Kamu adalah alasan mengapa aku tersenyum setiap hari"</button>
        </div>
    </div>

    <!-- Modal Popup -->
    <div id="questionModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Pertanyaan untuk Fani ❤️</h2>
            <p>Apa Fani sayang Asa?</p>
            <input type="text" id="answer" placeholder="Ketik jawabanmu di sini...">
            <button onclick="validateAnswer()">Submit</button>
            <p id="result" class="result"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
